  <!--
    Resolve the theme before first paint so there is no light-mode flash, and
    mark JS as available so CSS can safely hide elements that GSAP animates in.
  -->
  <script>
    (function () {
      var r = document.documentElement;
      r.classList.add('js');
      try {
        var saved = localStorage.getItem('vr-theme');
        r.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
      } catch (e) {
        r.dataset.theme = 'dark';
      }
    })();
  </script>
